<!doctype html>
<html lang="en">
<head>

<style>
  :root {
    --bg: #0b0b0c; --surface: #141416; --surface-2: #1b1b1e; --surface-3: #242428;

// Every visual is a pure function of t (seconds). seek(t) renders one frame.

// ---------- easing ----------
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const ease = bezier(0.16, 1, 0.3, 1);            // the product's motion curve

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b, f = ease) => f(lin(t, a, b));
const mix = (a, b, p) => a + (b - a) * p;
const env = (t, a, b, c, d) => Math.min(E(t, a, b), 1 - E(t, c, d, easeIn));

{
  const b = el("div", "abs", "", P[0].p); b.style.cssText += "left:60px;top:84px;width:1000px;height:110px;border:1.5px solid #c4552e;border-radius:6px;";

}

const anaChips = DATA.queryTerms.map((t) => { const c = el("div", "abs chip", t, P[1].p); c.style.fontSize = "38px"; return c; });
