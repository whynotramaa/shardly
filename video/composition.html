<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shardly film</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root { --serif: "Zarathustra", "Coconat", serif; --sans: "Syne", sans-serif; --mono: "Geist Mono", monospace; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f3; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f4f4f3; color: var(--ink); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .abs { position: absolute; left: 0; top: 0; }
  .serif { font-family: var(--serif); font-weight: 400; white-space: nowrap; }
  .sans { font-family: var(--sans); white-space: nowrap; }
  .mono { font-family: var(--mono); white-space: nowrap; }
  .label { font-family: var(--mono); font-size: 16px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .mw { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.1em 0.06em 0.24em; margin: -0.1em -0.06em -0.24em; }
  .mi { display: inline-block; }
  .em { color: var(--ember-text); }
  .chip { position: absolute; font-family: var(--mono); color: var(--ember-text); background: var(--ember-soft); border: 1.5px solid var(--ember); border-radius: 2px; white-space: nowrap; }
  .tag { font-family: var(--mono); font-size: 14px; letter-spacing: 0.12em; color: var(--muted); border: 1px solid var(--hair2); padding: 3px 8px; border-radius: 2px; display: inline-block; white-space: nowrap; }
  .card { position: absolute; width: 300px; height: 176px; background: var(--surface); border: 1px solid var(--hair2); border-radius: 3px; padding: 18px 20px; backface-visibility: hidden; }
  .card .ttl { font-family: var(--sans); font-weight: 600; font-size: 22px; color: var(--ink); margin-top: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .ln { height: 7px; background: var(--s3); margin-top: 13px; border-radius: 1px; }
  .halo { text-shadow: 0 0 28px var(--bg), 0 0 14px var(--bg), 0 0 6px var(--bg); }
  svg { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// Every frame is a pure function of t (seconds): seek(t) renders it.
// Scene starts live in timeline.json, shared with the score in scripts/sound.py.
const TL = __TIMELINE__;
const DATA = __SEARCH_DATA__;
const W = 1920, H = 1080, FPS = TL.fps, DURATION = TL.duration;

// ---------- easing and time ----------
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const ease = bezier(0.16, 1, 0.3, 1);            // the product's motion curve
const easeIn = bezier(0.7, 0, 0.84, 0);
const easeInOut = bezier(0.65, 0, 0.35, 1);
const snap = bezier(0.2, 0.9, 0.2, 1);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const E = (t, a, b, f = ease) => f(lin(t, a, b));
const mix = (a, b, p) => a + (b - a) * p;
const env = (t, a, b, c, d) => Math.min(E(t, a, b), 1 - E(t, c, d, easeIn));
const fmt = (n, d = 2) => n.toFixed(d);
const fmtInt = (n) => Math.round(n).toLocaleString("en-US");
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }

// ---------- theme: light and dark tokens from DESIGN.md, interpolated per frame ----------
const LIGHT = { bg: "#f4f4f3", surface: "#ffffff", s2: "#ececeb", s3: "#e2e2e0", ink: "#17171a", ink2: "#3d3d43", muted: "#6b6b72", hair: "#dededb", hair2: "#c6c6c2", ember: "#b0431d", "ember-text": "#a33c17" };
const DARK = { bg: "#0b0b0c", surface: "#141416", s2: "#1b1b1e", s3: "#242428", ink: "#ededec", ink2: "#b9b9bd", muted: "#87878c", hair: "#2a2a2e", hair2: "#3a3a3f", ember: "#c4552e", "ember-text": "#e27950" };
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const TOK = {};
function setTheme(th) {
  for (const k in LIGHT) {
    const a = hex(LIGHT[k]), b = hex(DARK[k]);
    TOK[k] = a.map((v, i) => Math.round(mix(v, b[i], th)));
    stage.style.setProperty(`--${k}`, `rgb(${TOK[k].join(",")})`);
  }
  stage.style.setProperty("--ember-soft", `rgba(${TOK.ember.join(",")},${mix(0.12, 0.17, th)})`);
  stage.style.setProperty("--grid", `rgba(${TOK.ink.join(",")},${mix(0.045, 0.03, th)})`);
}
const rgba = (k, a = 1) => `rgba(${TOK[k].join(",")},${a})`;

// ---------- DOM helpers ----------
const stage = document.getElementById("stage");
function el(tag, cls, html, parent = stage) { const n = document.createElement(tag); if (cls) n.className = cls; if (html !== undefined) n.innerHTML = html; parent.appendChild(n); return n; }
const div = (cls, html, parent) => el("div", cls, html, parent);
const layer = (parent = stage) => div("layer", "", parent);
const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent, style = {}) { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); Object.assign(n.style, style); parent.appendChild(n); return n; }
const svgLayer = (parent) => svgEl("svg", { width: W, height: H }, parent);
function place(n, x, y, { o = 1, s = 1, blur = 0, ax = 0, ay = 0, r = 0, sx = 1, sy = 1 } = {}) {
  n.style.transform = `translate(${x}px, ${y}px) translate(${-ax * 100}%, ${-ay * 100}%) scale(${s * sx}, ${s * sy}) rotate(${r}deg)`;
  n.style.opacity = o; n.style.filter = blur > 0.05 ? `blur(${blur}px)` : "none";
  n.style.visibility = o <= 0.001 ? "hidden" : "visible";
}
function setLine(l, x1, y1, x2, y2, o = 1) {
  l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2); l.style.opacity = o;
}
const rect = (n) => n.getBoundingClientRect();
const show = (n, on) => { n.style.display = on ? "" : "none"; };
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Masked line text: words rise out of their own clip boxes. *word* marks the accent.
function maskText(parent, cls, text, size) {
  const n = div(`abs ${cls}`, "", parent); n.style.fontSize = `${size}px`;
  const parts = [];
  text.split(" ").forEach((w, i) => {
    if (i) n.appendChild(document.createTextNode(" "));
    const accent = /^\*.*\*[.,?]?$/.test(w);
    const wrap = el("span", "mw", "", n), inner = el("span", "mi" + (accent ? " em" : ""), esc(w.replace(/\*/g, "")), wrap);
    parts.push(inner);
  });
  n.parts = parts; return n;
}
function maskAnim(n, t, tin, tout = Infinity, { dur = 0.8, st = 0.07, outDur = 0.5 } = {}) {
  let vis = false;
  n.parts.forEach((p, i) => {
    const a = E(t, tin + i * st, tin + i * st + dur), b = tout === Infinity ? 0 : E(t, tout + i * st * 0.5, tout + i * st * 0.5 + outDur, easeIn);
    p.style.transform = `translateY(${(1 - a) * 115 - b * 115}%)`;
    if (a > 0 && b < 1) vis = true;
  });
  n.style.visibility = vis ? "visible" : "hidden";
}
function typeOn(n, text, t, t0, cps = 40) { const k = clamp(Math.floor((t - t0) * cps), 0, text.length); n.textContent = text.slice(0, k); return k; }

// ================= backdrop: paper, night wipe, grid, frame =================
const night = div("layer"); night.style.background = DARK.bg;
const day = div("layer"); day.style.background = LIGHT.bg;
const gridSvg = svgLayer(stage);
for (let x = 120; x < W; x += 120) svgEl("line", { x1: x, y1: 0, x2: x, y2: H }, gridSvg, { stroke: "var(--grid)" });
for (let y = 120; y < H; y += 120) svgEl("line", { x1: 0, y1: y, x2: W, y2: y }, gridSvg, { stroke: "var(--grid)" });
const frameSvg = svgLayer(stage);
const corners = [[64, 64, 1, 1], [W - 64, 64, -1, 1], [64, H - 64, 1, -1], [W - 64, H - 64, -1, -1]].map(([cx, cy, sx, sy]) =>
  svgEl("path", { d: `M${cx} ${cy + 30 * sy} L${cx} ${cy} L${cx + 30 * sx} ${cy}`, fill: "none", "stroke-width": 1.2 }, frameSvg, { stroke: "var(--muted)" }));
const timecode = div("abs label");
const brandTag = div("abs label", "shardly");

// motion blur filters: one horizontal gaussian per sliding layer
const defs = svgEl("defs", {}, svgLayer(stage));
let mbCount = 0;
function motionBlur(n) {
  const id = `mb${mbCount++}`, f = svgEl("filter", { id, x: "-10%", y: "-10%", width: "120%", height: "120%" }, defs);
  const g = svgEl("feGaussianBlur", { stdDeviation: "0 0" }, f);
  return (amount) => { if (amount < 0.3) n.style.filter = "none"; else { g.setAttribute("stdDeviation", `${amount} 0`); n.style.filter = `url(#${id})`; } };
}

// ================= 01 OPEN: the answer is somewhere in your files =================
const S1 = layer();
const caret0 = div("abs", "", S1); caret0.style.cssText += "width:6px;height:96px;background:var(--ember);";
const hookA = maskText(S1, "serif", "Somewhere in your files", 128);
const hookB = maskText(S1, "serif", "is the *answer* you need.", 128);
const field3d = div("layer", "", S1); field3d.style.perspective = "1200px"; field3d.style.perspectiveOrigin = "960px 540px";
const fieldWorld = div("abs", "", field3d); fieldWorld.style.cssText += "transform-style:preserve-3d;transform:translate(960px,540px);";
const CARD_KINDS = [
  ...DATA.titles.code.slice(0, 22).map((t) => ["TS", t]),
  ...DATA.titles.docs.map((t) => ["MD", t]),
  ...DATA.titles.wiki.slice(0, 22).map((t) => ["WIKI", t]),
  ["PDF", "design-review.pdf"], ["PDF", "postmortem-q3.pdf"], ["PDF", "onboarding.pdf"], ["PDF", "rfc-0007.pdf"],
  ["REPO", "whynotramaa/shardly"], ["REPO", "shardly/web"], ["JSON", "fixtures.json"], ["NDJSON", "wikipedia.ndjson"],
];
const R1 = rng(7);
const fieldCards = CARD_KINDS.map(([tag, title], i) => {
  const c = div("card", `<span class="tag">${tag}</span><div class="ttl">${esc(title)}</div><div class="ln" style="width:88%"></div><div class="ln" style="width:64%"></div><div class="ln" style="width:76%"></div>`, fieldWorld);
  const side = i % 2 ? 1 : -1;
  return { c, x: side * (260 + R1() * 1250), y: (R1() - 0.5) * 1150, z0: -300 - R1() * 3900, ry: (R1() - 0.5) * 16, rx: (R1() - 0.5) * 10, tag };
});
const countNum = div("abs serif halo", "", S1); countNum.style.fontSize = "150px"; countNum.style.lineHeight = "1";
const countLbl = div("abs mono halo", `documents &nbsp;·&nbsp; ${DATA.mix.code} source files &nbsp;·&nbsp; ${DATA.mix.docs} docs &nbsp;·&nbsp; ${fmtInt(DATA.mix.wikipedia)} wikipedia articles`, S1);
countLbl.style.cssText += "font-size:24px;color:var(--ink2);";
const finds = maskText(S1, "serif halo", "*Shardly* finds it.", 150);

// ================= 02 SEARCH: the product, for real =================
const S2 = layer();
const uiGroup = layer(S2);
const idleTitle = maskText(uiGroup, "serif", "Search everything you have.", 76);
const boxSvg = svgLayer(uiGroup);
const boxRect = svgEl("rect", { rx: 6 }, boxSvg, { fill: "var(--surface)", stroke: "var(--hair2)", strokeWidth: 1.4 });
const boxUnder = svgEl("line", { "stroke-width": 2 }, boxSvg, { stroke: "var(--ember)" });
const scanSweep = svgEl("line", { "stroke-width": 3 }, boxSvg, { stroke: "var(--ember)" });
const placeholder = div("abs mono", "Search code, docs, PDFs and repos", uiGroup); placeholder.style.cssText += "font-size:36px;color:var(--muted);";
const qText = div("abs mono", "", uiGroup); qText.style.cssText += "font-size:40px;white-space:pre;color:var(--ink);";
const caret = div("abs", "", uiGroup); caret.style.cssText += "width:3px;height:46px;background:var(--ember);";
const QUERY = DATA.query;
const Q_T = Array.from(QUERY, (_, i) => TL.type + i * 0.082 + (i % 4 === 1 ? 0.035 : 0) + (i > 5 ? 0.06 : 0));
const searchBtn = div("abs mono", "<span>Search</span>", S2);
searchBtn.style.cssText += "font-size:22px;color:#fff;background:var(--ember);display:flex;align-items:center;justify-content:center;border-radius:3px;font-weight:600;letter-spacing:0.04em;";
const statLine = div("abs mono", `${DATA.total} results &nbsp;·&nbsp; ${fmtInt(DATA.documents)} documents searched &nbsp;·&nbsp; <span class="em">${DATA.tookMs.toFixed(1)} ms</span>`, uiGroup);
statLine.style.cssText += "font-size:21px;color:var(--muted);";
const ROW_X = 340, ROW_W = 1240, ROW_H = 128, ROW_Y0 = 330;
const TYPE_TAG = { code: "CODE", markdown: "MARKDOWN", article: "WIKI" };
const markTerms = (text) => esc(text).replace(new RegExp(`(${DATA.queryTerms.join("|")})`, "gi"), `<span class="m">$1</span>`);
const rows = DATA.hits.map((h, i) => {
  const row = div("abs", "", uiGroup); row.style.cssText += `width:${ROW_W}px;height:${ROW_H}px;`;
  const rank = div("abs mono", String(i + 1).padStart(2, "0"), row); rank.style.cssText += "font-size:18px;color:var(--muted);top:9px;";
  const title = div("abs sans", esc(h.title), row); title.style.cssText += "font-size:30px;font-weight:600;color:var(--ember-text);left:56px;top:0;";
  const tag = el("span", "abs tag", TYPE_TAG[h.type] ?? h.type.toUpperCase(), row); tag.style.top = "9px";
  const p = div("abs mono", esc(h.path), row); p.style.cssText += "font-size:18px;color:var(--muted);left:56px;top:46px;";
  const score = div("abs mono", fmt(h.score), row); score.style.cssText += "font-size:22px;color:var(--ink);left:auto;right:0;top:6px;";
  const sn = div("abs mono", markTerms(h.line), row); sn.style.cssText += "font-size:20px;color:var(--ink2);left:56px;top:82px;overflow:hidden;";
  const rule = div("abs", "", row); rule.style.cssText += `top:${ROW_H - 1}px;width:${ROW_W}px;height:1px;background:var(--hair);transform-origin:left;`;
  return { row, title, tag, sn, rule, marks: [...sn.querySelectorAll(".m")] };
});
const preview = div("abs", `<div class="label">preview &nbsp;·&nbsp; ${esc(DATA.hits[0].path)}</div>
<div class="serif" style="font-size:56px;margin-top:22px;white-space:normal;line-height:1.05">Crash recovery guide</div>
<div class="sans" style="font-size:22px;line-height:1.7;color:var(--ink2);margin-top:18px;white-space:normal">A write-ahead log records intent before segment data is written. <span class="pvm">Recovery replays durable records after a process crash.</span></div>
<div class="sans" style="font-size:22px;line-height:1.7;color:var(--muted);margin-top:16px;white-space:normal">Acknowledged writes survive restart. A torn final record is discarded.</div>`, uiGroup);
preview.style.cssText += "width:580px;height:520px;background:var(--surface);border:1px solid var(--hair2);border-radius:3px;padding:34px 40px;";
const pvm = preview.querySelector(".pvm");
const annSvg = svgLayer(uiGroup);
const ANN = [
  { text: "the exact passage that matched", sub: "highlighted at its original offsets" },
  { text: "the whole document", sub: "fetched with one direct byte seek" },
].map((a) => {
  const n = div("abs", `<div class="sans" style="font-size:26px;font-weight:600">${a.text}</div><div class="mono" style="font-size:18px;color:var(--muted);margin-top:6px">${a.sub}</div>`, uiGroup);
  return { n, line: svgEl("polyline", { fill: "none", "stroke-width": 1.4 }, annSvg, { stroke: "var(--ink2)" }), dot: svgEl("rect", { width: 9, height: 9 }, annSvg, { fill: "var(--ember)" }) };
});
const qA = maskText(S2, "serif", "How did it find that", 122);
const qB = maskText(S2, "serif", `in *${DATA.tookMs.toFixed(1)}* milliseconds?`, 122);

// ================= 03 INSIDE: the map =================
const S3 = layer();
const inA = maskText(S3, "serif", "Inside, every layer is *hand-built.*", 104);
const inB = maskText(S3, "sans", "No database. No search library. Just TypeScript you can read.", 34);
inB.style.color = "var(--ink2)";
const MAP = [
  ["01", "Ingest", "files, repos and PDFs", "become documents"],
  ["02", "Analyze", "text is split", "into terms"],
  ["03", "Index", "each term points to", "the documents with it"],
  ["04", "Rank", "BM25 orders", "the matches"],
  ["05", "Store", "an append-only log", "read by direct seek"],
  ["06", "Recover", "the write-ahead log", "survives kill -9"],
];
const mapLayer = layer(S3);
const mapSvg = svgLayer(mapLayer);
const mapLine = svgEl("line", { "stroke-width": 1.4 }, mapSvg, { stroke: "var(--hair2)" });
const mapTrail = svgEl("line", { "stroke-width": 2 }, mapSvg, { stroke: "var(--ember)" });
const MAP_X = (i) => 210 + i * 280, MAP_Y = 520;
const mapNodes = MAP.map(([num, name, a, b], i) => {
  const sq = svgEl("rect", { width: 18, height: 18, x: -9, y: -9, "stroke-width": 1.5 }, mapSvg, { fill: "var(--bg)", stroke: "var(--muted)" });
  const n = div("abs", `<div class="label" style="letter-spacing:.14em">${num}</div><div class="serif" style="font-size:52px;margin-top:10px">${name}</div><div class="mono" style="font-size:18px;color:var(--muted);margin-top:12px;line-height:1.5">${a}<br>${b}</div>`, mapLayer);
  return { sq, n };
});
const mapSignal = div("abs", "", mapLayer); mapSignal.style.cssText += "width:20px;height:20px;background:var(--ember);";

// ================= persistent chapter rail =================
const railLayer = layer();
const RAIL_X = (i) => 520 + i * 176, RAIL_Y = 1004;
const railSvg = svgLayer(railLayer);
const railLine = svgEl("line", { x1: RAIL_X(0), y1: RAIL_Y - 30, x2: RAIL_X(5), y2: RAIL_Y - 30, "stroke-width": 1 }, railSvg, { stroke: "var(--hair2)" });
const railTicks = MAP.map((_, i) => svgEl("rect", { x: RAIL_X(i) - 4, y: RAIL_Y - 34, width: 8, height: 8 }, railSvg, { fill: "var(--bg)", stroke: "var(--muted)" }));
const railLabels = MAP.map(([num, name]) => div("abs label", `${num} ${name}`, railLayer));
const railMark = div("abs", "", railLayer); railMark.style.cssText += "height:2px;background:var(--ember);";

// ================= chapter scaffolding =================
const CHAPTERS = [];
function chapter(i, key, next, headline, sub) {
  const root = layer(), inner = layer(root);
  const kicker = div("abs label", `<span class="em">${MAP[i][0]} / 06</span> &nbsp; ${MAP[i][1]}`, inner);
  const head = maskText(inner, "serif", headline, 84);
  const subN = div("abs sans", sub, inner); subN.style.cssText += "font-size:28px;color:var(--ink2);";
  const c = { i, root, inner, kicker, head, sub: subN, t0: TL[key], t1: TL[next], blur: motionBlur(inner) };
  CHAPTERS.push(c); return c;
}
// returns local time inside the chapter, or null when it is off screen
function runChapter(c, t) {
  if (t < c.t0 - 0.01 || t > c.t1 + 0.01) { show(c.root, false); return null; }
  show(c.root, true);
  const pin = E(t, c.t0, c.t0 + 0.8), pout = E(t, c.t1 - 0.55, c.t1, easeIn);
  c.inner.style.transform = `translateX(${320 * (1 - pin) - 320 * pout}px)`;
  c.inner.style.opacity = Math.min(E(t, c.t0, c.t0 + 0.35, (x) => x), 1 - pout);
  c.blur(28 * (1 - E(t, c.t0, c.t0 + 0.5)) * (t > c.t0 ? 1 : 0) + 30 * pout);
  const u = t - c.t0;
  place(c.kicker, 140, 104, { o: E(u, 0.2, 0.6) });
  place(c.head, 140, 140); maskAnim(c.head, u, 0.25);
  place(c.sub, 142, 262 + 12 * (1 - E(u, 0.7, 1.2)), { o: E(u, 0.7, 1.2) });
  return u;
}

// ---------------- 01 INGEST ----------------
const CI = chapter(0, "ingest", "analyze", "Anything with text goes in.", "Every source is extracted into plain JSON documents with a stable id.");
const SOURCES = [
  ["FOLDER", "projects/shardly", "watched, re-read on change"],
  ["GITHUB", "whynotramaa/shardly", "repo, readme and source files"],
  ["PDF", "design-review.pdf", "text extracted page by page"],
  ["NDJSON", "records.ndjson", "one document per line"],
  ["WIKI", "wikipedia sample", `${fmtInt(DATA.mix.wikipedia)} offline articles`],
  ["BINARY", "photo.png", "not text"],
];
const SRC_Y = (i) => 372 + i * 92;
const srcRows = SOURCES.map(([tag, name, sub], i) => {
  const n = div("abs", `<span class="tag" style="width:96px;text-align:center">${tag}</span><span class="sans" style="font-size:26px;font-weight:600;margin-left:22px">${name}</span><div class="mono" style="font-size:17px;color:var(--muted);margin:8px 0 0 118px">${sub}</div>`, CI.inner);
  return n;
});
const rejectMark = div("abs mono", "rejected before indexing", CI.inner); rejectMark.style.cssText += "font-size:17px;color:var(--ember-text);";

    const zr = rect(zoomBox);
    setLine(zoomLines[0], bl, TAPE.y + TAPE.h, mix(bl, zr.left, zA), mix(TAPE.y + TAPE.h, zr.top, zA), zA);
    setLine(zoomLines[1], br, TAPE.y + TAPE.h, mix(br, zr.right, zA), mix(TAPE.y + TAPE.h, zr.top, zA), zA);
    lookSteps.forEach((n, i) => {
      const a = E(u, 5.3 + i * 0.6, 5.6 + i * 0.6);
      place(n, 140 + i * 420, 880, { o: a * (1 - E(u, 8.8, 9.1)) });
    });
    const tA = E(u, 9.1, 9.5), tcx = bx((tomb.b0 + tomb.b1) / 2);
    setLine(tombLine, tcx, TAPE.y - 4, tcx, TAPE.y - 4 - 34 * tA, tA);
    place(tombLbl, tcx, TAPE.y - 70, { ax: 0.5, o: tA });
  }

  // ---- 06 recover ----
  if ((u = runChapter(CV, t)) !== null) {
    const kill = TL.kill - CV.t0, dead0 = kill + 0.35, back = TL.restart - CV.t0, proofU = TL.proof - CV.t0;
    const diagO = 1 - E(u, proofU - 0.5, proofU, easeIn);
    show(cvLayer, diagO > 0.001); cvLayer.style.opacity = diagO;
    const lanes = E(u, 0.9, 1.5, easeInOut);
    setLine(walLane, LANE_X0, WAL_Y, mix(LANE_X0, LANE_X1, lanes), WAL_Y, 1);
    setLine(segLane, LANE_X0, SEG_Y + SEG_H / 2 + 14, mix(LANE_X0, LANE_X1, lanes), SEG_Y + SEG_H / 2 + 14, 1);
    place(laneLbls[0], 140, WAL_Y - 10, { o: lanes }); place(laneLbls[1], 140, SEG_Y - 10, { o: lanes });
    const T = { p1: 1.6, r1: 2.4, c1: 3.2, ack: 3.8, p2: 4.6, r2: 5.1 };
    const nodeState = (n, appear, fillAt, x, keep = 1) => {
      const a = E(u, appear, appear + 0.3);
      n.g.setAttribute("transform", `translate(${x} ${WAL_Y}) scale(${0.4 + 0.6 * a})`); n.g.style.opacity = a * keep;
      const f = fillAt == null ? 0 : E(u, fillAt, fillAt + 0.12);
      n.fill.style.opacity = f; n.fill.setAttribute("transform", `scale(${f})`);
      const pp = fillAt == null ? 0 : lin(u, fillAt, fillAt + 0.5);
      n.pulse.style.opacity = pp > 0 && pp < 1 ? 1 - pp : 0; n.pulse.setAttribute("transform", `scale(${1 + 1.5 * ease(pp)})`);
      n.ring.style.stroke = f > 0.5 ? "var(--ember)" : "var(--muted)";
    };
    const scanP = E(u, back + 0.9, back + 2.6, easeInOut), scanX = mix(LANE_X0 - 40, LANE_X1 + 40, scanP);
    const passed = (x) => scanX > x && u > back + 0.9;
    const drop2 = E(u, back + 2.1, back + 2.9);
    nodeState(nP1, T.p1 - 0.2, T.p1, N_X.P1); nodeState(nC1, T.c1 - 0.2, T.c1, N_X.C1); nodeState(nP2, T.p2 - 0.2, T.p2, N_X.P2, 1 - 0.8 * drop2); nodeState(nC2, kill + 0.6, null, N_X.C2, (u > back ? 1 : 0) * (1 - drop2));
    [[N_X.P1, T.p1], [N_X.C1, T.c1], [N_X.P2, T.p2], [N_X.C2, back + 0.2]].forEach(([x, at], k) => place(nodeLbl[k], x, WAL_Y + 32, { ax: 0.5, o: E(u, at, at + 0.3) * (k >= 2 ? 1 - drop2 : 1) }));
    const cn = [E(u, T.p1 + 0.15, T.p1 + 0.4), E(u, T.c1 - 0.25, T.c1), E(u, T.p2 + 0.15, T.p2 + 0.4)];
    setLine(conns[0], N_X.P1, WAL_Y + 15, mix(N_X.P1, RC1[0] + 40, cn[0]), mix(WAL_Y + 15, SEG_Y - SEG_H / 2, cn[0]), cn[0] > 0 ? 1 : 0);
    setLine(conns[1], RC1[1] - 2, SEG_Y - SEG_H / 2, mix(RC1[1] - 2, N_X.C1, cn[1]), mix(SEG_Y - SEG_H / 2, WAL_Y + 15, cn[1]), cn[1] > 0 ? 1 : 0);
    setLine(conns[2], N_X.P2, WAL_Y + 15, mix(N_X.P2, RC2[0] + 40, cn[2]), mix(WAL_Y + 15, SEG_Y - SEG_H / 2, cn[2]), cn[2] > 0 ? 1 - 0.8 * drop2 : 0);
    rec1.outline.style.opacity = E(u, 1.2, 1.5); rec2.outline.style.opacity = E(u, 1.3, 1.6) * (1 - 0.6 * drop2);
    rec2.outline.setAttribute("stroke-dasharray", drop2 > 0.1 ? "6 6" : "none");
    const f1 = E(u, T.r1, T.r1 + 0.45, easeInOut) * (RC1[1] - RC1[0]);
    rec1.fill.setAttribute("width", f1); rec1.txt.style.width = `${Math.max(0, f1 - 30)}px`; place(rec1.txt, RC1[0] + 18, SEG_Y - 13);
    const f2 = u >= T.r2 ? (RC2[1] - RC2[0]) * 0.62 * bezier(0.2, 0.6, 0.35, 1)(lin(u, T.r2, kill)) : 0;
    rec2.fill.setAttribute("width", f2); rec2.txt.style.width = `${Math.max(0, f2 - 30)}px`; place(rec2.txt, RC2[0] + 18, SEG_Y - 13);
    rec2.fill.style.opacity = rec2.txt.style.opacity = 1 - drop2;
    const fx = RC2[0] + f2, yTop = SEG_Y - SEG_H / 2;
    if (u >= kill) { let d = `M${fx + 1} ${yTop - 1}`; for (let i = 0; i <= 8; i++) d += ` L${fx - (i % 2 ? 16 : 2)} ${yTop + (SEG_H / 8) * i}`; tornEdge.setAttribute("d", d + ` L${fx + 1} ${yTop + SEG_H + 1} Z`); }
    tornEdge.style.opacity = (u >= kill ? 1 : 0) * (1 - drop2);
    // shards: the torn record dissolves during replay
    shards.forEach((s, k) => {
      const r = rng(k + 3), sx0 = RC2[0] + r() * f2, sy0 = yTop + r() * SEG_H, p = lin(u, back + 2.1 + r() * 0.3, back + 3.1 + r() * 0.3);
      s.setAttribute("x", sx0 + (r() - 0.5) * 80 * p); s.setAttribute("y", sy0 + 160 * p * p); s.setAttribute("width", 6 + r() * 10); s.setAttribute("height", 6 + r() * 10);
      s.style.opacity = p > 0 && p < 1 ? 1 - p : 0;
    });
    // step captions for the first write
    const tagPos = [[N_X.P1 + 16, WAL_Y - 64], [RC1[0], SEG_Y + SEG_H / 2 + 34], [N_X.C1 - 16, WAL_Y - 64], [N_X.C1 - 16, WAL_Y - 104]];
    const stAt = [T.p1, T.r1, T.c1, T.ack];
    stepTags.forEach((n, i) => place(n, tagPos[i][0], tagPos[i][1] + 8 * (1 - E(u, stAt[i], stAt[i] + 0.3)), { ax: i === 0 ? 1 : 0, o: E(u, stAt[i], stAt[i] + 0.3) * (1 - E(u, T.p2 - 0.2, T.p2 + 0.1)) }));
    const walTxt = u < T.c1 ? WAL_JSON("pending") : WAL_JSON("committed");
    if (u < kill) { typeOn(walLine, walTxt, u, u < T.c1 ? T.p1 : T.c1, 90); place(walLine, 140, 370, { o: E(u, T.p1, T.p1 + 0.2) * (1 - E(u, T.p2 - 0.3, T.p2)) }); }
    else walLine.style.visibility = "hidden";
    // kill
    const glitching = u >= kill && u < dead0;
    place(killTag, RC2[1], SEG_Y - SEG_H / 2 - 90, { ax: 1, o: env(u, kill - 0.02, kill + 0.03, dead0 - 0.05, dead0), s: 1 + 0.18 * (1 - E(u, kill, kill + 0.3)) });
    cvLayer.style.transform = glitching ? `translate(${Math.round(Math.sin(u * 2300) * 14)}px, ${Math.round(Math.cos(u * 1700) * 6)}px)` : "none";
    // restart: a terminal line, then the replay scan
    const termTxt = `$ shardly open ./data\n  replaying wal.log … ${u > back + 2.9 ? "1 kept, 1 discarded" : ""}`;
    typeOn(term, termTxt, u, back + 0.1, 60); place(term, 140, 350, { o: u >= back ? 1 : 0 });
    const scanOn = u > back + 0.9 && u < back + 2.7;
    setLine(scanLn, scanX, WAL_Y - 80, scanX, SEG_Y + SEG_H / 2 + 80, scanOn ? 1 : 0);
    scanBand.setAttribute("x", Math.max(LANE_X0 - 40, scanX - 200)); scanBand.setAttribute("width", Math.max(0, Math.min(200, scanX - LANE_X0 + 40))); scanBand.style.opacity = scanOn ? 1 : 0;
    const v1 = passed(RC1[1]) ? E(u, back + 1.5, back + 1.8) : 0;
    place(verdict1, RC1[0], SEG_Y + SEG_H / 2 + 34, { o: v1 });
    place(verdict2, RC2[1], SEG_Y + SEG_H / 2 + 34, { ax: 1, o: passed(RC2[0] + 200) ? E(u, back + 2.1, back + 2.4) : 0 });
    rec1.fill.style.filter = v1 > 0 && u < back + 2.2 ? `drop-shadow(0 0 ${12 * v1}px var(--ember))` : "none";
    place(cvCap, 140, 896, { o: E(u, back + 3.0, back + 3.4) });
    place(CV.sub, 142, 262, { o: E(u, 0.7, 1.2) * (1 - E(u, kill - 0.4, kill)) });
    // the proof
    const pf = u - proofU, out = E(u, 14.4, 14.9, easeIn);
    show(proof, pf > -0.1);
    const roll = (c, start, dur, spins) => c.cols.forEach((col, i) => {
      const s = start + i * 0.06, p = bezier(0.2, 0.7, 0.2, 1)(lin(pf, s, s + dur));
      col.strip.style.transform = `translateY(${-p * (spins * 10 + col.d) * c.size * 1.05}px)`;
    });
    roll(cA, 0.2, 1.3, 1); roll(cB, 0.45, 1.1, 1); roll(cC, 0.7, 1.0, 2);
    const PY = 470, zl = E(pf, 1.8, 2.1);
    place(cA.wrap, 140, PY + 30 * (1 - E(pf, 0.1, 0.6)), { o: E(pf, 0.1, 0.5) * (1 - out) });
    place(cB.wrap, 1010, PY + 30 * (1 - E(pf, 0.35, 0.85)), { o: E(pf, 0.35, 0.75) * (1 - out) });
    cC.num.style.color = zl > 0.05 ? "var(--ember-text)" : ""; cC.lab.style.color = zl > 0.05 ? "var(--ember-text)" : "";
    place(cC.wrap, 1400, PY + 30 * (1 - E(pf, 0.6, 1.1)), { o: E(pf, 0.6, 1.0), s: 1 + 0.08 * zl });
    cC.lab.style.opacity = 1 - out;
    place(proofCap, 140, PY + 310, { o: E(pf, 1.3, 1.7) * (1 - out) });
  }
  // glitch overlay and the blackout sit above every chapter
  const gk = t >= TL.kill && t < TL.kill + 0.35, gr2 = rng(frame * 7 + 3);
  show(glitchSvg, gk);
  if (gk) glitchBars.forEach((b, k) => { b.setAttribute("x", gr2() * 1500 - 100); b.setAttribute("y", gr2() * 1080); b.setAttribute("width", 200 + gr2() * 900); b.setAttribute("height", 2 + gr2() * 26); b.style.fill = k % 3 ? rgba("ember", 0.85) : k % 2 ? rgba("ink", 0.9) : rgba("bg", 1); });
  stage.style.filter = t >= TL.kill + 0.12 && t < TL.kill + 0.18 ? "invert(1)" : "none";
  const blk = t >= TL.kill + 0.35 && t < TL.restart;
  show(blackout, blk);
  if (blk) { typeOn(deadA, "process killed by signal 9\n\n$ shardly open ./data", t, TL.kill + 0.4, 55); place(deadA, 140, 470); }

  // ================= S7 finale =================
  const s7on = t >= TL.recap - 0.1;
  show(S7, s7on);
  if (s7on) {
    const r0 = TL.recap, conv = E(t, TL.lockup - 0.9, TL.lockup - 0.1, easeInOut);
    place(recapHead, 960, 300, { ax: 0.5 }); maskAnim(recapHead, t, r0 + 0.1, TL.lockup - 1.1);
    const draw = E(t, r0 + 0.4, r0 + 1.4, easeInOut), LY = 601;
    MAP.forEach((_, i) => {
      const a = E(t, r0 + 0.5 + i * 0.16, r0 + 1.0 + i * 0.16);
      const x = mix(MAP_X(i), 960, conv);
      place(recapNodes[i], x - 9, 626 + 16 * (1 - a), { o: a * (1 - E(t, TL.lockup - 1.0, TL.lockup - 0.6)) });
      recapSq[i].setAttribute("transform", `translate(${x} ${LY - 1}) rotate(45) scale(${a * (1 - conv)})`);
    });
    if (t < TL.lockup) setLine(recapLine, MAP_X(0) + (960 - MAP_X(0)) * conv, LY - 1, mix(MAP_X(0), MAP_X(5), draw) - (MAP_X(5) - 960) * conv, LY - 1, 1);
    else recapLine.style.opacity = 0;
    // lockup
    const lk = TL.lockup, LKY = 600;
    const uDraw = E(t, lk - 0.1, lk + 0.7, easeInOut);
    setLine(lockLine, 960 - 560 * uDraw, LKY, 960 + 560 * uDraw, LKY, t >= lk - 0.1 ? 1 - E(t, DURATION - 1.2, DURATION - 0.6) : 0);
    wordLetters.forEach((s, i) => {
      const a = E(t, lk + 0.2 + i * 0.07, lk + 1.0 + i * 0.07);
      s.style.transform = `translateY(${70 * (1 - a)}px)`; s.style.opacity = a;
      s.style.filter = a < 0.98 ? `blur(${10 * (1 - a)}px)` : "none";
    });
    const outO = 1 - E(t, DURATION - 1.3, DURATION - 0.5);
    place(word, 960 - M.word / 2, 262, { o: (t >= lk ? 1 : 0) * outO });
    place(tag1, 960, LKY + 36, { ax: 0.5, o: outO }); maskAnim(tag1, t, lk + 1.3);
    place(tag2, 960, LKY + 150 + 10 * (1 - E(t, lk + 2.1, lk + 2.5)), { ax: 0.5, o: E(t, lk + 2.1, lk + 2.5) * outO });
    place(repo, 960, LKY + 214 + 10 * (1 - E(t, lk + 2.7, lk + 3.1)), { ax: 0.5, o: E(t, lk + 2.7, lk + 3.1) * outO });
    const cOn = t > lk + 3.2 && Math.floor((t - lk) * 1.6) % 2 === 0;
    place(cursorEnd, 960 + M.repo / 2 + 12, LKY + 214, { o: cOn ? outO : 0 });
  }
}

window.seek = seek;
window.DURATION = DURATION; window.FPS = FPS;
window.ready = document.fonts.ready.then(() => { setTheme(0); measure(); seek(0); return true; });
if (location.search.includes("play")) window.ready.then(() => { const t0 = performance.now(); const f = () => { seek(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(f); }; f(); });
</script>
