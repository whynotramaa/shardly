function bezier(x1, y1, x2, y2) {

  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x; const d = dx(t); if (Math.abs(e) < 1e-6 || !d) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}

    }
    const wx = W / 2 - M.wordW / 2, wy = 300;
    wordLetters.forEach((s, i) => {
      const a = E(t, 16.75 + i * 0.07, 17.45 + i * 0.07);
      s.style.transform = `translateY(${60 * (1 - a)}px)`;
      s.style.opacity = a; s.style.filter = a < 0.98 ? `blur(${10 * (1 - a)}px)` : "none";
      s.style.clipPath = `inset(0 0 ${(1 - a) * 100}% 0)`;
    });
    place(word, wx, wy, { o: t >= 16.7 ? 1 - E(t, 19.4, 19.75) : 0 });
    const tx = W / 2 - M.tagW / 2, ty = LY + 40;
    tagWords.forEach((s, i) => {
      const a = E(t, 17.75 + i * 0.035, 18.2 + i * 0.035);
      s.style.opacity = a; s.style.transform = `translateY(${12 * (1 - a)}px)`;
    });
    place(tagline, tx, ty, { o: t >= 17.7 ? 1 - E(t, 19.4, 19.75) : 0 });
    // the cursor from second zero returns and blinks once
    const cOn = (t >= 18.75 && t < 19.05) || (t >= 19.3 && t < 19.6);
    place(cursorEnd, tx + M.tagW + 10, ty + 2, { o: cOn ? 1 : 0 });
  }
  place(blackout, 0, 0, { o: t >= 19.8 ? 1 : 0 });
}

window.seek = seek;
window.DURATION = DURATION; window.FPS = FPS;
window.ready = document.fonts.ready.then(() => { measure(); seek(0); return true; });
// preview mode: open with ?play to watch in a browser
if (location.search.includes("play")) window.ready.then(() => { const t0 = performance.now(); const f = () => { const t = ((performance.now() - t0) / 1000) % DURATION; seek(t); requestAnimationFrame(f); }; f(); });
</script>
